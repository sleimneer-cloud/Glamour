name: Windows Release Build

on:
  push:
    branches: [ "client" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 윈도우용 Qt 및 컴파일러 설치
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'

    - name: 3. 프로젝트 빌드 (qmake 기준)
      shell: bash # 리눅스 터미널 환경으로 강제!
      run: |
        mkdir build
        cd build
        qmake ../glamour_client.pro "CONFIG+=release" 
        mingw32-make

    - name: 4. windeployqt로 배포 폴더 만들기
      shell: bash # 여기서도 bash 사용!
      run: |
        cd build
        mkdir deploy
        # 완성된 exe 파일의 이름을 정확히 지정해서 복사 (release 폴더 안이거나 루트에 있거나 둘 중 하나)
        cp release/glamour_client.exe deploy/ || cp glamour_client.exe deploy/
        # windeployqt가 폴더가 아닌 exe 파일을 직접 타겟팅하도록 수정
        windeployqt deploy/glamour_client.exe

    - name: 5. 완성된 폴더를 Zip 파일로 깃허브에 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Glamour_Windows_Test_Version
        path: build/deploy/

name: Windows Release Build

on:
  push:
    branches: [ "client" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 윈도우용 Qt 및 컴파일러 설치
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'

    - name: 3. 프로젝트 빌드 (qmake 기준)
      shell: bash # 리눅스 터미널 환경으로 강제!
      run: |
        mkdir build
        cd build
        qmake ../glamour_client.pro "CONFIG+=release" 
        mingw32-make

    - name: 4. windeployqt로 배포 폴더 만들기
      shell: bash
      run: |
        cd build
        mkdir -p deploy
        
        # 1. 이름이 무엇이든 방금 만들어진 .exe 파일을 찾아서 deploy 폴더로 복사
        find . -name "*.exe" -type f -exec cp {} deploy/ \;
        
        cd deploy
        
        # 2. 복사된 .exe 파일의 실제 이름을 알아내서 변수에 저장
        EXE_FILE=$(ls *.exe | head -n 1)
        echo "발견된 실행 파일: $EXE_FILE"
        
        # 3. 그 파일에 windeployqt 적용
        windeployqt $EXE_FILE

    - name: 5. 완성된 폴더를 Zip 파일로 깃허브에 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Glamour_Windows_Test_Version
        path: build/deploy/

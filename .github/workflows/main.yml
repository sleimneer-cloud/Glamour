name: Windows Release Build

on:
  push:
    branches: [ "for-Windows" ] # for-Windows 브랜치에서 실행
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 1. 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 윈도우용 Qt 및 컴파일러 설치
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2' # 희석님 버전
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'

    - name: 3. 프로젝트 빌드 (qmake 기준)
      run: |
        mkdir build
        cd build
        qmake .. "CONFIG+=release"
        mingw32-make

    - name: 4. windeployqt로 배포 폴더 만들기
      run: |
        cd build
        mkdir deploy
        # qmake는 보통 release 폴더 안에 exe를 만듭니다.
        cp release/*.exe deploy/
        cd deploy
        windeployqt .

    - name: 5. 완성된 폴더를 Zip 파일로 깃허브에 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Glamour_Windows_Test_Version
        path: build/deploy/

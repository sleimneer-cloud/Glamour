name: Windows Release Build

# 언제 이 작업이 실행될지 정의합니다.
on:
  push:
    branches: [ "main", "master", "for-Windows"  ] # 코드가 푸시될 때 자동 실행
  workflow_dispatch: # 깃허브 웹에서 수동으로 버튼을 눌러 실행할 수 있게 함

jobs:
  build:
    runs-on: windows-latest # 마이크로소프트가 제공하는 최신 윈도우 환경 사용

    steps:
    - name: 1. 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 2. 윈도우용 Qt 및 컴파일러 설치
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.4.2' # ★현재 희석님이 리눅스에서 사용 중인 Qt 버전에 맞게 수정하세요 (예: 6.6.0)
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw' # MinGW 컴파일러 세팅

    - name: 3. 프로젝트 빌드 (CMake 기준)
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: 4. windeployqt로 배포 폴더 만들기
      run: |
        cd build
        mkdir deploy
        # 빌드된 exe 파일을 deploy 폴더로 복사 (경로는 프로젝트 구조에 따라 다를 수 있음)
        cp ./Release/Glamour.exe ./deploy/Glamour.exe || cp ./Glamour.exe ./deploy/Glamour.exe
        # windeployqt 실행하여 필수 dll 파일들을 deploy 폴더에 모음
        windeployqt ./deploy/Glamour.exe

    - name: 5. 완성된 폴더를 Zip 파일로 깃허브에 업로드 (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Glamour_Windows_Test_Version
        path: build/deploy/
